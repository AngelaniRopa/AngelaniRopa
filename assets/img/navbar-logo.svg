<svg width="2400" height="600" viewBox="0 0 2400 600" xmlns="http://www.w3.org/2000/svg">

  <!-- Fondo transparente -->
  <rect width="100%" height="100%" fill="transparent"/>

  <!-- Línea superior -->
  <line x1="250" y1="150" x2="2150" y2="150"
        stroke="#ffffff" stroke-width="5" opacity="0.85"/>

  <!-- Texto principal -->
  <text 
    x="50%" 
    y="52%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="260"
    letter-spacing="18"
    fill="#ffffff"
    font-weight="700">
    ANGELANI
  </text>

  <!-- Subtítulo -->
  <text 
    x="50%" 
    y="75%"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="60"
    letter-spacing="14"
    fill="#ffffff"
    opacity="0.9">
    ROPA DE CAMPO
  </text>

  <!-- Línea inferior -->
  <line x1="450" y1="480" x2="1950" y2="480"
        stroke="#ffffff" stroke-width="5" opacity="0.85"/>

</svg>